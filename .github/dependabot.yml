version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    target-branch: "develop"   # open dependency PRs against develop, not main
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: build          # dev-only deps -> no release triggered
      prefix-development: build
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # @rollup/plugin-typescript does not support TypeScript 7 yet -> hold at 5.x.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    target-branch: "develop"   # open dependency PRs against develop, not main
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
