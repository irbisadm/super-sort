name: Bug report
description: Report something that behaves worse than its documented joke
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report! Remember: many algorithms here are *intentionally* broken or
        non-terminating. Please check the [readme](../../readme.md) to confirm the behavior
        isn't the joke itself.
  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: e.g. 1.2.0
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: e.g. 20.11.0
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Which function did you call, and what did it do?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: A minimal code snippet that shows the problem.
      render: javascript
